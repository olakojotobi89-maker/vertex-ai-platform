<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vertex AI | Login</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/login.css">

</head>

<body>

<div class="background-glow"></div>

<div class="login-container">

<div class="logo-area">

<img src="logo.png">

<h1>Vertex <span>AI</span></h1>

<p>Powered by Visual Vertex Technology</p>

</div>

<h2>Welcome Back 👋</h2>

<p class="subtitle">

Sign in to continue building smarter businesses.

</p>

<form id="loginForm">

<div class="input-box">

<label>Email Address</label>

<input
type="email"
placeholder="Enter your email"
required>

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
placeholder="Enter your password"
required>

</div>

<div class="forgot">

<a href="#">Forgot Password?</a>

</div>

<button type="submit">

Login →

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button class="google">

Continue with Google

</button>

<p class="signup">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</div>

<script src="js/login.js"></script>

</body>

</html>

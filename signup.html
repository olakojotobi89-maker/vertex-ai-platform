<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vertex AI | Sign Up</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/signup.css">

</head>

<body>

<div class="background-glow"></div>

<div class="signup-container">

<div class="logo-area">

<img src="logo.png">

<h1>Vertex <span>AI</span></h1>

<p>Powered by Visual Vertex Technology</p>

</div>

<h2>Create your account</h2>

<p class="subtitle">

Join Vertex AI and build smarter businesses.

</p>

<form>

<div class="input-box">

<label>Full Name</label>

<input
type="text"
placeholder="Enter your full name">

</div>

<div class="input-box">

<label>Email Address</label>

<input
type="email"
placeholder="Enter your email">

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
placeholder="Create password">

</div>

<div class="input-box">

<label>Confirm Password</label>

<input
type="password"
placeholder="Confirm password">

</div>

<button>

Create Account →

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button class="google">

Continue with Google

</button>

<p class="login">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</body>

</html>

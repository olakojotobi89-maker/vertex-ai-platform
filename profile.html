<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile • Vertex AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Page styles already used by the app -->
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/profile.css" />

  <!-- Shared nav system (injected via page styles) -->
  <link rel="stylesheet" href="css/nav.css" />

</head>

<body>
  <!-- PAGE CONTENT (minimal placeholder; existing app style) -->
  <div class="vx-app-shell" data-page="profile">
    <header class="vx-topbar" role="banner">
      <button class="vx-icon-btn ripple" type="button" id="vxMenuBtn" aria-label="Open menu">
        <i data-lucide="menu" aria-hidden="true"></i>
      </button>

      <div class="vx-topbar-title" aria-live="polite">Profile</div>

      <div class="vx-topbar-right">
        <button class="vx-icon-btn ripple" type="button" id="vxNotifyBtn" aria-label="Notifications">
          <i data-lucide="bell" aria-hidden="true"></i>
        </button>
        <button class="vx-avatar-btn ripple" type="button" id="vxProfileBtn" aria-label="User profile">
          <span class="vx-avatar">V</span>
        </button>
      </div>
    </header>

    <div class="vx-overlay" id="vxOverlay" hidden></div>

    <aside class="vx-sidebar" id="vxSidebar" aria-label="Sidebar Navigation" aria-hidden="true">
      <div class="vx-sidebar-header">
        <img class="vx-sidebar-logo" src="logo.png" alt="Vertex AI" />
        <div>
          <h2>Vertex AI</h2>
          <p>Powered by Visual Vertex Technology Company</p>
        </div>
      </div>

      <nav class="vx-sidebar-nav" aria-label="Sidebar">
        <a class="vx-sidebar-link" href="dashboard.html" data-nav="dashboard">
          <i data-lucide="layout-grid" aria-hidden="true"></i><span>Dashboard</span>
        </a>
        <a class="vx-sidebar-link" href="workspace.html" data-nav="workspace">
          <i data-lucide="briefcase" aria-hidden="true"></i><span>Business Workspaces</span>
        </a>
        <a class="vx-sidebar-link" href="app.html" data-nav="chat">
          <i data-lucide="message-square" aria-hidden="true"></i><span>AI Chat</span>
        </a>
        <a class="vx-sidebar-link" href="profile.html" data-nav="profile">
          <i data-lucide="user" aria-hidden="true"></i><span>Profile</span>
        </a>
        <a class="vx-sidebar-link" href="settings.html" data-nav="settings">
          <i data-lucide="settings" aria-hidden="true"></i><span>Settings</span>
        </a>
        <a class="vx-sidebar-link" href="#" data-nav="help">
          <i data-lucide="help-circle" aria-hidden="true"></i><span>Help & Support</span>
        </a>
        <a class="vx-sidebar-link" href="#" data-nav="logout">
          <i data-lucide="log-out" aria-hidden="true"></i><span>Logout</span>
        </a>
      </nav>

      <div class="vx-sidebar-footer">
        <div class="vx-app-version">Vertex AI v1.0</div>
      </div>
    </aside>

    <main class="vx-content" role="main" aria-label="Profile">
      <section class="vx-card">
        <div class="vx-card-body">
          <h1 class="vx-h1">Profile</h1>
          <p class="vx-p">Profile UI placeholder. Future: user data from Node.js + Supabase.</p>
        </div>
      </section>

      <!-- future workspace switching / unread badges / user profile details -->
    </main>

    <nav class="vx-bottom-nav" aria-label="Bottom Navigation">
      <a class="vx-bottom-item" href="dashboard.html" data-bottom="dashboard">
        <i data-lucide="home" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a class="vx-bottom-item" href="workspace.html" data-bottom="workspace">
        <i data-lucide="briefcase" aria-hidden="true"></i>
        <span>Workspace</span>
      </a>
      <a class="vx-bottom-item" href="app.html" data-bottom="chat">
        <i data-lucide="message-square" aria-hidden="true"></i>
        <span>AI Chat</span>
      </a>
      <a class="vx-bottom-item" href="profile.html" data-bottom="profile">
        <i data-lucide="user" aria-hidden="true"></i>
        <span>Profile</span>
      </a>
      <a class="vx-bottom-item" href="settings.html" data-bottom="settings">
        <i data-lucide="settings" aria-hidden="true"></i>
        <span>Settings</span>
      </a>
    </nav>

    <!-- minimal placeholder scripts -->
    <script>
      lucide.createIcons();
    </script>
    <script src="js/nav.js"></script>
  </div>
</body>
</html>
